name-template: $RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION
version-template: $MAJOR.$MINOR.$PATCH

template: |
  <!-- Optional: add a release summary here -->
  $CHANGES

# Emoji reference: https://gitmoji.carloscuesta.me/
categories:
  # Exclusions
  - type: pre-exclude
    when:
      labels:
        - duplicate
        - invalid
        - no-changelog
        - reverted
  # Version Resolution
  - type: version-resolver
    semver-increment: major
    when:
      labels:
        - breaking
        - removed
        - bump-major-version
  - type: version-resolver
    semver-increment: minor
    when:
      labels:
        - feature
        - bump-minor-version
  # Named Categories
  - title: 💥 Breaking Changes
    when:
      label: breaking
  - title: 🚨 Removed
    when:
      label: removed
  - title: ⚠️ Deprecated
    when:
      label: deprecated
  - title: 🚀 New Features and Improvements
    when:
      labels:
        - enhancement
        - feature
  - title: 🐛 Bug Fixes
    when:
      label: fix
  - title: 📦 Dependency Updates
    when:
      label: dependencies # Used by Dependabot
  - title: 📝 Documentation Updates
    when:
      label: documentation
  - title: 👻 Maintenance
    when:
      label: maintenance
  - title: 🚦 Tests
    when:
      label: tests
